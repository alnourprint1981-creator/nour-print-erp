<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عروض الأسعار — نظام إدارة مطبعة النور</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main id="page-content">

<div class="page-title"><h1>عروض الأسعار</h1><a href="quotation-create.html" class="btn btn-primary" data-fr="FR-QUOTE-01">+ عرض سعر جديد</a></div>
<div class="card">
  <table class="table">
    <thead><tr><th data-fr="FR-QUOTE-01">رقم العرض</th><th>العميل</th><th>المنتج</th><th>الكمية</th><th>الإجمالي</th><th data-fr="FR-QUOTE-03">الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

</main>
<script src="assets/js/shared-layout.js"></script>
<script src="assets/js/mock-data.js"></script>
<script>
renderAppShell({ activePage: "quotations", breadcrumbs: ['الرئيسية', 'عروض الأسعار'] });
</script>
<script>
(function(){
  var st={ 'مسودة':'badge-gray','مرسل للعميل':'badge-navy','قيد الانتظار':'badge-yellow','مقبول':'badge-green','مرفوض':'badge-red','منتهي':'badge-gray' };
  var tb=document.getElementById('rows');
  quotations.forEach(function(q){
    var tr=document.createElement('tr');
    tr.innerHTML='<td><b>'+q.id+'</b></td><td>'+q.customer+'</td><td>'+q.product+'</td><td class="num">'+q.qty+'</td>'+
      '<td class="num">'+q.total.toLocaleString()+'</td><td><span class="badge '+(st[q.status]||'badge-gray')+'">'+q.status+'</span></td>'+
      '<td>'+q.date+'</td>'+
      '<td><a class="btn btn-sm btn-outline" href="quotation-details.html">عرض</a> <button class="btn btn-sm btn-secondary" onclick="alert(\'تم النسخ (شكلي)\')">نسخ</button> <button class="btn btn-sm btn-primary" onclick="window.print()">طباعة</button></td>';
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العملاء — نظام إدارة مطبعة النور</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main id="page-content">

<div class="page-title"><h1>العملاء</h1><a href="customer-create.html" class="btn btn-primary" data-fr="FR-CRM-01">+ عميل جديد</a></div>
<div class="card">
  <div class="form-row" style="margin-bottom:14px">
    <div class="form-group"><label>بحث</label><input type="search" id="q" placeholder="اسم / هاتف / شركة..." data-fr="FR-UI-04"></div>
    <div class="form-group"><label>فلتر حسب النوع</label><select id="f"><option value="">الكل</option><option>شركة</option><option>مصنع</option><option>متجر</option><option>تاجر جملة</option><option>متجر إلكتروني</option><option>فرد</option><option>عميل دائم</option><option>عميل جديد</option></select></div>
  </div>
  <table class="table">
    <thead><tr><th data-fr="FR-CRM-01">الكود</th><th data-fr="FR-CRM-01">الاسم</th><th>الشركة</th><th data-fr="FR-CRM-03">النوع</th><th>الهاتف</th><th>WhatsApp</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

</main>
<script src="assets/js/shared-layout.js"></script>
<script src="assets/js/mock-data.js"></script>
<script>
renderAppShell({ activePage: "customers", breadcrumbs: ['الرئيسية', 'العملاء'] });
</script>
<script>
(function(){
  var tb=document.getElementById('rows');
  function draw(){
    var q=document.getElementById('q').value, f=document.getElementById('f').value;
    tb.innerHTML='';
    customers.filter(function(c){
      return (!f||c.type===f)&&(!q||c.name.includes(q)||c.phone.includes(q)||c.company.includes(q));
    }).forEach(function(c){
      var tr=document.createElement('tr');
      tr.innerHTML='<td>'+c.code+'</td><td><b>'+c.name+'</b></td><td>'+c.company+'</td><td><span class="badge badge-navy">'+c.type+'</span></td><td class="num">'+c.phone+'</td><td class="num">'+c.whatsapp+'</td>'+
        '<td><a class="btn btn-sm btn-outline" href="customer-details.html">عرض</a></td>';
      tb.appendChild(tr);
    });
  }
  document.getElementById('q').oninput=draw;
  document.getElementById('f').onchange=draw;
  draw();
})();
</script>
</body>
</html>
